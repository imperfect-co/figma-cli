# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
# The site is built by Zensical, so the default Sphinx/MkDocs steps are replaced.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install .[docs]
    build:
      html:
        - zensical build --strict
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp -r site/* $READTHEDOCS_OUTPUT/html/
